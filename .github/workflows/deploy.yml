name: Deploy VitePress site to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 必须 cancel-in-progress：Pages 只认「最后一次成功的部署」，与提交新旧无关。
  # 设成 false 时，一个旧提交的手动重跑（workflow_dispatch）如果比新提交晚完成，
  # 会把线上站点回滚成旧内容——实测把 7 个知识库的站点盖成了 4 个。
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      # 注意：docs/ 内容由本地 `npm run sync` 预生成并提交，
      # CI 不执行 sync（知识库源文件不在本仓库中）
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
